name: Refresh profile README

on:
  schedule:
    # 04:00 UTC daily — catches up on the previous day's activity across all repos.
    - cron: '0 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh README from live GitHub data
        env:
          # Needs read access across owned repos (including private ones) — the default
          # GITHUB_TOKEN only sees this one repo, so a PAT with `repo` scope is required.
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: bash scripts/update-readme.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh live repo/commit stats"
          # Guard against overlapping runs (e.g. a push trigger and a manual/scheduled run
          # landing close together) racing on the same ref — rebase onto whatever landed
          # first and retry a few times before giving up.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, retrying after rebase (attempt $i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
